<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Platapicker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 14px;
      user-select: none;
      -webkit-app-region: drag;
    }

    .duck {
      font-size: 60px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-8px); }
    }

    .name {
      font-size: 22px;
      font-weight: 700;
      color: #6c8ef7;
      letter-spacing: -0.3px;
    }

    .tagline {
      font-size: 11px;
      color: #8892a4;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #2e3347;
      border-top-color: #6c8ef7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      font-size: 12px;
      color: #8892a4;
    }

    #status.error {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="duck">🦆</div>
  <div class="name">Platapicker</div>
  <div class="tagline">Deal Command Center</div>
  <div class="status-row">
    <div class="spinner" id="spinner"></div>
    <span id="status">Starting backend…</span>
  </div>

  <script>
    // Electron's main process can update the status message
    window.setStatus = (msg, isError = false) => {
      const el = document.getElementById('status')
      el.textContent = msg
      if (isError) {
        el.classList.add('error')
        document.getElementById('spinner').style.display = 'none'
      }
    }
  </script>
</body>
</html>
